name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pyarmor:
        description: Obfuscate with PyArmor before packaging
        type: boolean
        default: false

permissions:
  contents: write

env:
  UV_LINK_MODE: copy

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Inno Setup
        run: choco install innosetup -y
      - run: uv sync --group dev
      - run: uv run python -m unittest discover -s tests -v
      - name: Write Telegram secrets for build
        shell: pwsh
        env:
          CAMDOT_TELEGRAM_BOT_TOKEN: ${{ secrets.CAMDOT_TELEGRAM_BOT_TOKEN }}
          CAMDOT_TELEGRAM_CHAT_ID: ${{ secrets.CAMDOT_TELEGRAM_CHAT_ID }}
        run: |
          if (-not $env:CAMDOT_TELEGRAM_BOT_TOKEN) { exit 0 }
          @"
          BOT_TOKEN = "$env:CAMDOT_TELEGRAM_BOT_TOKEN"
          CHAT_ID = "$env:CAMDOT_TELEGRAM_CHAT_ID"
          "@ | Set-Content -Encoding utf8 app/core/telegram_secrets.py
      - name: Build CamDot installer
        env:
          PYARMOR: ${{ github.event_name == 'workflow_dispatch' && inputs.pyarmor && '1' || '0' }}
          CAMDOT_TELEGRAM_BOT_TOKEN: ${{ secrets.CAMDOT_TELEGRAM_BOT_TOKEN }}
          CAMDOT_TELEGRAM_CHAT_ID: ${{ secrets.CAMDOT_TELEGRAM_CHAT_ID }}
        run: uv run python tools/deploy.py
      - name: Export version
        shell: bash
        run: echo "VERSION=$(uv run python -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          generate_release_notes: true
          files: |
            dist/CamDot-v${{ env.VERSION }}-Windows-x86_64-Setup.exe
            dist/CamDot-v${{ env.VERSION }}-Windows-x86_64.exe

  # macOS and Linux packaging will be enabled in a later release.
  build-macos-arm:
    if: false
    runs-on: macos-14
    steps:
      - run: echo "macOS builds are disabled for now"

  build-macos-intel:
    if: false
    runs-on: macos-13
    steps:
      - run: echo "macOS builds are disabled for now"

  build-linux:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linux builds are disabled for now"

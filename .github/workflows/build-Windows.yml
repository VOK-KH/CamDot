name: Build Windows

on:
  workflow_dispatch:
    inputs:
      pyarmor:
        description: Obfuscate with PyArmor before packaging
        type: boolean
        default: false

env:
  UV_LINK_MODE: copy

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Write Telegram secrets for build
        if: ${{ secrets.CAMDOT_TELEGRAM_BOT_TOKEN != '' }}
        shell: pwsh
        run: |
          @"
          BOT_TOKEN = "$env:CAMDOT_TELEGRAM_BOT_TOKEN"
          CHAT_ID = "$env:CAMDOT_TELEGRAM_CHAT_ID"
          "@ | Set-Content -Encoding utf8 app/core/telegram_secrets.py

      - name: Build CamDot installer
        env:
          PYARMOR: ${{ inputs.pyarmor && '1' || '0' }}
          CAMDOT_TELEGRAM_BOT_TOKEN: ${{ secrets.CAMDOT_TELEGRAM_BOT_TOKEN }}
          CAMDOT_TELEGRAM_CHAT_ID: ${{ secrets.CAMDOT_TELEGRAM_CHAT_ID }}
        run: uv run python tools/deploy.py

      - name: Export version
        shell: bash
        run: echo "VERSION=$(uv run python -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamDot-v${{ env.VERSION }}-Windows-x86_64
          path: |
            dist/CamDot-v${{ env.VERSION }}-Windows-x86_64-Setup.exe
            dist/CamDot-v${{ env.VERSION }}-Windows-x86_64.exe

name: Build Linux

on:
  workflow_dispatch:
    inputs:
      pyarmor:
        description: Obfuscate with PyArmor before packaging
        type: boolean
        default: false

env:
  UV_LINK_MODE: copy

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build CamDot
        env:
          PYARMOR: ${{ inputs.pyarmor && '1' || '0' }}
        run: uv run python tools/deploy.py

      - name: Export version
        run: echo "VERSION=$(uv run python -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamDot-v${{ env.VERSION }}-Linux-${{ matrix.arch }}
          path: dist/CamDot-v${{ env.VERSION }}-Linux-${{ matrix.arch }}.tar.gz

[project]
name = "camdot"
version = "0.2.3"
description = "CamDot — download posts from Facebook, Instagram, TikTok, YouTube, and X."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "selenium>=4.6.0",
    "yt-dlp[curl-cffi,default]",
    "PySide6",
    "imageio-ffmpeg>=0.6.0",
]

[project.urls]
Repository = "https://github.com/VOK-KH/CamDot"
Changelog = "https://github.com/VOK-KH/CamDot/releases"

[project.scripts]
camdot = "app.main:main"
camdot-gui = "app.gui:main"
camdot-setup = "app.core.runtime:setup_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The artwork lives in images/ next to the package in a checkout; copy the sets
# the UI needs inside the package for installs (app/core/icons.py looks in both places).
[tool.hatch.build.targets.wheel.force-include]
"images/icons" = "app/images/icons"
"images/dialog" = "app/images/dialog"
"images/botty" = "app/images/botty"

[dependency-groups]
dev = [
    "pyarmor>=9.2.7",
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = true
